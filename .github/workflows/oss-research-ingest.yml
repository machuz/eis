name: "OSS research ingest"

# Observe the research target repos and POST one EIS research run to the
# OrbitLens research store (POST /oss/research/ingest). Manual for now
# (workflow_dispatch) so each run is deliberate and targeted; promote to a
# schedule once the prod data path is proven.
#
# Disk: scripts/run-ingest.sh clones + analyzes ONE repo at a time and deletes
# it before the next, so the ~50GB dataset never lands all at once.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Ingest API base URL"
        type: choice
        default: "https://api.stg.orbitlens.io"
        options:
          - "https://api.stg.orbitlens.io"
          - "https://api.orbitlens.io"
      only:
        description: "Comma-separated manifest dirs (blank = all 25)"
        type: string
        default: ""
      max_commit_pages:
        description: "GitHub Commits-API pages for the email→id fallback"
        type: string
        default: "10"
      run_id:
        description: "Override run_id (blank = ingest-<github_run_id>). Set to an existing run to ACCRETE repos into it without collapsing the map to the new subset."
        type: string
        default: ""
      fast_log:
        description: "Pass --fast-log (numstat-only) — much faster on giant repos (react/kubernetes/rust); gravity essentially unaffected"
        type: boolean
        default: false
      dry_run:
        description: "Assemble + log but do not POST"
        type: boolean
        default: false

concurrency:
  group: oss-research-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Persist eis's blame cache ($HOME/.eis/cache) across runs — the CI equivalent
      # of the worker's S3 blame cache. A rolling key (run_id) with a prefix
      # restore-key incrementally warms the cache, so giant-repo blames (react etc.)
      # get progressively cheaper each run instead of always cold. eis namespaces the
      # cache dir by its own BlameCacheEpoch, so a stale key self-invalidates.
      - name: Cache eis blame results
        uses: actions/cache@v4
        with:
          path: ~/.eis/cache
          key: eis-blame-${{ github.run_id }}
          restore-keys: |
            eis-blame-

      - name: Run ingest
        env:
          # Privileged research-ingest bearer (NOT a per-account eis_ key). stg
          # and prod have distinct tokens; pick by the chosen api_base so a prod
          # run never authenticates with the stg token (and vice versa).
          RESEARCH_INGEST_TOKEN: ${{ inputs.api_base == 'https://api.orbitlens.io' && secrets.RESEARCH_INGEST_TOKEN_PROD || secrets.RESEARCH_INGEST_TOKEN_STG }}
          # Lets the email→id fallback hit the Commits API for non-noreply authors.
          GITHUB_TOKEN: ${{ github.token }}
          API_BASE: ${{ inputs.api_base }}
          ONLY: ${{ inputs.only }}
          MAX_COMMIT_PAGES: ${{ inputs.max_commit_pages }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FAST_LOG: ${{ inputs.fast_log && '1' || '0' }}
          # Default to a fresh per-run id; override to accrete into an existing run.
          RUN_ID: ${{ inputs.run_id != '' && inputs.run_id || format('ingest-{0}', github.run_id) }}
        run: ./research/oss-gravity-map/scripts/run-ingest.sh
