name: Publish Blog Posts

on:
  push:
    branches: [main]
    paths:
      - 'docs/blog-*.md'
      # note (note.com) and X (twitter/x.com) files are manually published; exclude from CI trigger.
      - '!docs/blog-ja-note-*.md'
      - '!docs/blog-ja-x-*.md'

  # Manual trigger
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - init
          - publish-all
          - publish-file
          - reorder-structure-series
          - recreate-structure-ch6-onwards
          - hatena-list
          - hatena-delete
          - set-draft
          - set-published
          - devto-list
          - devto-unpublish
          - devto-publish
        default: 'init'
      file:
        description: 'publish-file/set-draft/set-published: md path(s). hatena-delete/devto-*: id(s). Space-separated.'
        required: false
        default: ''
      published:
        description: 'set-published only: optional RFC3339 datetime (e.g. 2026-07-01T09:00:00+09:00)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need HEAD~1 for diff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish changed blog posts
        if: github.event_name == 'push'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python scripts/publish-blog.py --changed

      - name: Initialize mapping
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'init'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python scripts/publish-blog.py --init

      - name: Publish specific file
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish-file'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python scripts/publish-blog.py "${{ inputs.file }}"

      - name: List Hatena entries
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'hatena-list'
        env:
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python scripts/publish-blog.py --hatena-list

      - name: Delete Hatena entries
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'hatena-delete'
        env:
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        # inputs.file holds one or more space-separated AtomPub edit ids.
        run: python scripts/publish-blog.py --hatena-delete ${{ inputs.file }}

      - name: Withdraw Hatena entries to draft
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'set-draft'
        env:
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python scripts/publish-blog.py --set-draft ${{ inputs.file }}

      - name: Republish Hatena entries from draft
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'set-published'
        env:
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          if [ -n "${{ inputs.published }}" ]; then
            python scripts/publish-blog.py --set-published ${{ inputs.file }} --published "${{ inputs.published }}"
          else
            python scripts/publish-blog.py --set-published ${{ inputs.file }}
          fi

      - name: List dev.to articles
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'devto-list'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python scripts/publish-blog.py --devto-list

      - name: Unpublish dev.to articles
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'devto-unpublish'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        # inputs.file holds one or more space-separated dev.to article ids.
        run: python scripts/publish-blog.py --devto-unpublish ${{ inputs.file }}

      - name: Re-publish dev.to articles
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'devto-publish'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python scripts/publish-blog.py --devto-publish ${{ inputs.file }}

      - name: Publish all blog posts
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish-all'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          for f in docs/blog-*.md; do
            # Skip note (note.com) and X (twitter/x.com) files — they are manually published.
            case "$f" in
              docs/blog-ja-note-*.md) echo "Skipping $f (note)"; continue ;;
              docs/blog-ja-x-*.md) echo "Skipping $f (X/twitter)"; continue ;;
            esac
            python scripts/publish-blog.py "$f"
            # Space requests to stay under dev.to rate limits (HTTP 429).
            sleep 1
          done

      - name: Reorder SDO series on dev.to
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'reorder-structure-series'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          python scripts/reorder-devto-series.py \
            docs/blog-en-devto-structure-ch0.md \
            docs/blog-en-devto-structure-ch1.md \
            docs/blog-en-devto-structure-ch2.md \
            docs/blog-en-devto-structure-ch3.md \
            docs/blog-en-devto-structure-ch4.md \
            docs/blog-en-devto-structure-ch5.md \
            docs/blog-en-devto-structure-ch6.md \
            docs/blog-en-devto-structure-ch7.md \
            docs/blog-en-devto-structure-ch8.md \
            docs/blog-en-devto-structure-ch9.md \
            docs/blog-en-devto-structure-ch10.md

      - name: Recreate SDO ch6-ch10 on dev.to
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'recreate-structure-ch6-onwards'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          python scripts/recreate-devto-articles.py \
            docs/blog-en-devto-structure-ch6.md \
            docs/blog-en-devto-structure-ch7.md \
            docs/blog-en-devto-structure-ch8.md \
            docs/blog-en-devto-structure-ch9.md \
            docs/blog-en-devto-structure-ch10.md

      - name: Sync Library dev.to links
        run: python scripts/sync-library-links.py

      - name: Commit mapping & Library link updates
        run: |
          if git diff --quiet docs/.blog-mapping.json docs/index.html 2>/dev/null; then
            echo "No mapping or Library link changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/.blog-mapping.json docs/index.html
            # [skip actions] keeps THIS workflow from re-triggering on its own
            # commit, while still letting Cloudflare Pages deploy (Pages ignores
            # the "actions" skip token but honors "[skip ci]"). Using [skip ci]
            # here would suppress the deploy and the synced links never go live.
            git commit -m "chore: update blog mapping & sync library links [skip actions]"
            git pull --rebase origin main
            git push
          fi
