# EIS config for esbuild
# Language: go
#
# Architecture patterns define which files represent structural decisions.
# Submit a PR to improve these patterns for fairer analysis.
# See: https://github.com/machuz/eis/tree/main/research/oss-gravity-map

sample_size: 500
blame_timeout: 120

exclude_file_patterns:
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "go.sum"
  - "*generated*"
  - "*.gen.*"
  - "*_test.go"
  - "*_test.rs"
  - "*_test.py"
  - "test_*.py"
  - "**/test/**"
  - "**/tests/**"
  - "**/testdata/**"
  - "**/fixtures/**"
  - "vendor/**"
  - "node_modules/**"
  - "*.pb.go"
  - "*.pb.cc"
  - "*.pb.h"

architecture_patterns:
  # --- audit fix: broaden coverage (** subtrees / impl / new subsystems) ---
  - "internal/js_parser/*.go"
  - "internal/js_ast/*.go"
  - "internal/css_parser/*.go"
  - "internal/css_ast/*.go"
  - "internal/ast/*.go"
  - "internal/linker/*.go"
  - "internal/bundler/*.go"
  - "internal/resolver/*.go"
  - "internal/graph/*.go"
  - "internal/config/*.go"
  - "pkg/cli/*.go"
  - "cmd/esbuild/*.go"
  - "*/types/*"
  - "*/core/*"
  - "*/internal/*"
  - "*/router*.go"
  - "*/middleware/*.go"
  - "*/handler/*.go"
  - "*/server/*.go"
  - "*/config/*.go"
  - "*/cmd/*.go"
  - "**/interface*.go"
  - "*_interface.go"
  - "*/registry/*.go"
  - "*/provider/*.go"
  - "*/plugin/*.go"
  - "*/api/*.go"
  - "pkg/api/*.go"
  - "pkg/js_parser/*.go"
  - "pkg/css_parser/*.go"
  - "pkg/js_ast/*.go"
  - "pkg/bundler/*.go"

blame_extensions:
  - "*.go"

aliases:
  "evanw": "Evan Wallace"

exclude_authors:
  - "github-actions[bot]"
  - "renovate[bot]"
  - "dependabot[bot]"
  - "web-flow"
  - "bors[bot]"
  - "rust-timer"
  - "rust-log-analyzer"

