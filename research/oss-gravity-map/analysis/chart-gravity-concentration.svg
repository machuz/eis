  <rect x="280" y="226" width="209" height="28" rx="4" fill="url(#gc-go)" opacity="0.9"/>
  <text x="497" y="245" fill="#42a5f5" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">48.7%</text>

  <!-- Systems (C/C++): 19.5% → width=84 -->
