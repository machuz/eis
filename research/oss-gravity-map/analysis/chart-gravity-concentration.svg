  <rect x="280" y="273" width="84" height="28" rx="4" fill="url(#gc-sys)" opacity="0.9"/>
  <text x="372" y="292" fill="#66bb6a" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">19.5%</text>
