<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="gc-fw" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef5350"/><stop offset="100%" stop-color="#c62828"/></linearGradient>
    <linearGradient id="gc-dyn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffd700"/><stop offset="100%" stop-color="#ffab00"/></linearGradient>
    <linearGradient id="gc-exp" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ab47bc"/><stop offset="100%" stop-color="#8e24aa"/></linearGradient>
    <linearGradient id="gc-go" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#42a5f5"/><stop offset="100%" stop-color="#1e88e5"/></linearGradient>
    <linearGradient id="gc-sys" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#66bb6a"/><stop offset="100%" stop-color="#2e7d32"/></linearGradient>
  </defs>
  <rect width="800" height="340" fill="#0d1117" rx="12"/>
  <text x="400" y="38" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600">Gravity Concentration by Language Family</text>
  <text x="400" y="58" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Share of total gravity held by the top 3 contributors</text>

  <!-- Grid: x=280 (0%) .. x=710 (100%), 4.30 px/% -->
  <line x1="280" y1="75" x2="280" y2="310" stroke="#21262d" stroke-width="1"/>
  <line x1="388" y1="75" x2="388" y2="310" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="495" y1="75" x2="495" y2="310" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="603" y1="75" x2="603" y2="310" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="710" y1="75" x2="710" y2="310" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="280" y="325" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">0%</text>
  <text x="388" y="325" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">25%</text>
  <text x="495" y="325" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">50%</text>
  <text x="603" y="325" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">75%</text>
  <text x="710" y="325" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">100%</text>

  <!-- Framework-driven: 61.3% → width=264 -->
  <text x="270" y="103" text-anchor="end" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="13" font-weight="500">Framework-driven</text>
  <rect x="280" y="85" width="264" height="28" rx="4" fill="url(#gc-fw)" opacity="0.9"/>
  <text x="552" y="104" fill="#ef5350" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">61.3%</text>

  <!-- Dynamic / Structural: 56.8% → width=244 -->
  <text x="270" y="150" text-anchor="end" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="13" font-weight="500">Dynamic / Structural</text>
  <rect x="280" y="132" width="244" height="28" rx="4" fill="url(#gc-dyn)" opacity="0.9"/>
  <text x="532" y="151" fill="#ffd700" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">56.8%</text>

  <!-- Expressive (Rust/Scala): 54.3% → width=234 -->
  <text x="270" y="197" text-anchor="end" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="13" font-weight="500">Expressive (Rust/Scala)</text>
  <rect x="280" y="179" width="234" height="28" rx="4" fill="url(#gc-exp)" opacity="0.9"/>
  <text x="522" y="198" fill="#ab47bc" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">54.3%</text>

  <!-- Go (Self-structured): 48.7% → width=209 -->
