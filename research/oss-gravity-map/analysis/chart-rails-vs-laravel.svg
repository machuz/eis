<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#0d1117" rx="12"/>
  <text x="400" y="35" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600">Rails vs Laravel: Governance Physics</text>
  <text x="400" y="55" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Same framework-driven family. Opposite authority structures.</text>

  <!-- Legend -->
  <rect x="270" y="68" width="14" height="14" rx="3" fill="#cc0000"/>
  <text x="290" y="80" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="12">Rails (6,056 engineers)</text>
  <rect x="490" y="68" width="14" height="14" rx="3" fill="#ff5722"/>
  <text x="510" y="80" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="12">Laravel (4,149 engineers)</text>

  <!-- Each metric pair is normalized to the larger value of that row (bars fill up to x=250..620, 370px reference). -->
  <text x="400" y="100" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">bars scaled per metric — read the numbers</text>

  <line x1="250" y1="108" x2="250" y2="380" stroke="#30363d" stroke-width="1"/>

  <!-- Top10 Design: Rails 57.0 (max → 370px), Laravel 12.0 (12.0/57.0*370=78) -->
  <text x="240" y="128" text-anchor="end" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="13" font-weight="500">Top10 Design</text>
  <rect x="250" y="112" width="370" height="20" rx="3" fill="#cc0000" opacity="0.85"/>
  <text x="628" y="127" fill="#cc0000" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">57.0</text>
  <rect x="250" y="136" width="78" height="20" rx="3" fill="#ff5722" opacity="0.85"/>
  <text x="336" y="151" fill="#ff5722" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">12.0</text>
  <text x="660" y="151" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">Rails 4.8x higher</text>

  <!-- Top10 Survival: Laravel 44.7 (max → 370px), Rails 2.5 (2.5/44.7*370=21) -->
  <text x="240" y="198" text-anchor="end" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="13" font-weight="500">Top10 Survival</text>
  <rect x="250" y="182" width="21" height="20" rx="3" fill="#cc0000" opacity="0.85"/>
  <text x="279" y="197" fill="#cc0000" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">2.5</text>
  <rect x="250" y="206" width="370" height="20" rx="3" fill="#ff5722" opacity="0.85"/>
  <text x="628" y="221" fill="#ff5722" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">44.7</text>
  <text x="660" y="221" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">Laravel 17.9x higher</text>

  <!-- Top10 Gravity (avg): Laravel 9.27 (max → 370px), Rails 2.44 (2.44/9.27*370=97) -->
  <text x="240" y="268" text-anchor="end" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="13" font-weight="500">Top10 Gravity (avg)</text>
  <rect x="250" y="252" width="97" height="20" rx="3" fill="#cc0000" opacity="0.85"/>
  <text x="355" y="267" fill="#cc0000" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">2.44</text>
  <rect x="250" y="276" width="370" height="20" rx="3" fill="#ff5722" opacity="0.85"/>
  <text x="628" y="291" fill="#ff5722" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">9.27</text>
  <text x="660" y="291" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">Laravel 3.8x higher</text>

  <!-- Gravity Concentration (top-3): Laravel 38.0% (max → 370px), Rails 9.8% (9.8/38.0*370=95) -->
  <text x="240" y="338" text-anchor="end" fill="#f0f6fc" font-family="-apple-system,sans-serif" font-size="13" font-weight="500">Grav. Concentration (top-3)</text>
  <rect x="250" y="322" width="95" height="20" rx="3" fill="#cc0000" opacity="0.85"/>
  <text x="353" y="337" fill="#cc0000" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">9.8%</text>
  <rect x="250" y="346" width="370" height="20" rx="3" fill="#ff5722" opacity="0.85"/>
  <text x="628" y="361" fill="#ff5722" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">38.0%</text>
  <text x="660" y="361" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">Laravel 3.9x higher</text>

  <text x="400" y="398" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="11">Rails spreads design across a bench; Laravel's structure runs through one architect (Otwell 65.1).</text>
</svg>