<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#0d1117" rx="12"/>
  <text x="400" y="35" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600">Three Modes of Structural Authority</text>
  <text x="400" y="55" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Governance, not language, decides who a system leans on</text>

  <!-- Mode 1: Single-founder gravity -->
  <g transform="translate(133,165)">
    <!-- Large central founder -->
    <circle cx="0" cy="0" r="40" fill="#ef5350" opacity="0.85"/>
    <text x="0" y="5" text-anchor="middle" fill="#0d1117" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">Founder</text>
    <!-- Small, unleant-on others -->
    <circle cx="-52" cy="-28" r="7" fill="#ef5350" opacity="0.25"/>
    <circle cx="52" cy="-28" r="7" fill="#ef5350" opacity="0.25"/>
    <circle cx="-52" cy="28" r="7" fill="#ef5350" opacity="0.2"/>
    <circle cx="52" cy="28" r="7" fill="#ef5350" opacity="0.2"/>
    <circle cx="0" cy="-56" r="6" fill="#ef5350" opacity="0.18"/>
    <circle cx="0" cy="56" r="6" fill="#ef5350" opacity="0.18"/>
    <circle cx="-62" cy="0" r="6" fill="#ef5350" opacity="0.18"/>
    <circle cx="62" cy="0" r="6" fill="#ef5350" opacity="0.18"/>
    <line x1="0" y1="0" x2="-52" y2="-28" stroke="#ef5350" stroke-width="1" opacity="0.25"/>
    <line x1="0" y1="0" x2="52" y2="-28" stroke="#ef5350" stroke-width="1" opacity="0.25"/>
    <line x1="0" y1="0" x2="-52" y2="28" stroke="#ef5350" stroke-width="1" opacity="0.25"/>
    <line x1="0" y1="0" x2="52" y2="28" stroke="#ef5350" stroke-width="1" opacity="0.25"/>
  </g>
  <text x="133" y="248" text-anchor="middle" fill="#ef5350" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">Single-founder gravity</text>
  <text x="133" y="266" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="11">swc, prettier, spring-boot, fastapi</text>
  <text x="133" y="283" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="11">Concentration: 77–98%</text>

  <!-- Mode 2: Standing bench -->
  <g transform="translate(400,165)">
    <circle cx="0" cy="-35" r="18" fill="#ab47bc" opacity="0.7"/>
    <circle cx="-32" cy="-12" r="18" fill="#ab47bc" opacity="0.65"/>
    <circle cx="32" cy="-12" r="18" fill="#ab47bc" opacity="0.6"/>
    <circle cx="-20" cy="22" r="18" fill="#ab47bc" opacity="0.55"/>
    <circle cx="20" cy="22" r="18" fill="#ab47bc" opacity="0.5"/>
    <circle cx="0" cy="48" r="14" fill="#ab47bc" opacity="0.45"/>
    <circle cx="-48" cy="20" r="14" fill="#ab47bc" opacity="0.4"/>
    <circle cx="48" cy="20" r="14" fill="#ab47bc" opacity="0.4"/>
    <circle cx="-45" cy="-25" r="12" fill="#ab47bc" opacity="0.35"/>
    <circle cx="45" cy="-25" r="12" fill="#ab47bc" opacity="0.35"/>
    <line x1="0" y1="-35" x2="-32" y2="-12" stroke="#ab47bc" stroke-width="1" opacity="0.2"/>
    <line x1="0" y1="-35" x2="32" y2="-12" stroke="#ab47bc" stroke-width="1" opacity="0.2"/>
    <line x1="-32" y1="-12" x2="-20" y2="22" stroke="#ab47bc" stroke-width="1" opacity="0.2"/>
    <line x1="32" y1="-12" x2="20" y2="22" stroke="#ab47bc" stroke-width="1" opacity="0.2"/>
    <line x1="-20" y1="22" x2="20" y2="22" stroke="#ab47bc" stroke-width="1" opacity="0.2"/>
  </g>
  <text x="400" y="248" text-anchor="middle" fill="#ab47bc" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">Standing bench</text>
  <text x="400" y="266" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="11">rails, kubernetes, rust, react</text>
  <text x="400" y="283" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="11">Concentration: 9–27%</text>

  <!-- Mode 3: Framework-as-architect -->
  <g transform="translate(667,165)">
    <!-- Framework rectangle holds dark-matter structure -->
    <rect x="-60" y="-50" width="120" height="100" rx="8" fill="none" stroke="#42a5f5" stroke-width="2.5" opacity="0.6"/>
    <text x="0" y="-58" text-anchor="middle" fill="#42a5f5" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" opacity="0.8">FRAMEWORK</text>
    <!-- founder still visible inside, framework's own gravity unread (dark) -->
    <circle cx="-18" cy="-8" r="16" fill="#42a5f5" opacity="0.55"/>
    <circle cx="22" cy="-20" r="9" fill="#42a5f5" opacity="0.3"/>
    <circle cx="18" cy="18" r="9" fill="#42a5f5" opacity="0.28"/>
    <circle cx="-22" cy="26" r="8" fill="#42a5f5" opacity="0.25"/>
    <circle cx="34" cy="4" r="7" fill="#42a5f5" opacity="0.22"/>
    <circle cx="-6" cy="-34" r="6" fill="#42a5f5" opacity="0.2"/>
  </g>
  <text x="667" y="248" text-anchor="middle" fill="#42a5f5" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">Framework-as-architect</text>
  <text x="667" y="266" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="11">structure lives in convention</text>
  <text x="667" y="283" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="11">Design reads dark; founder still high</text>

  <!-- Dividers -->
  <line x1="267" y1="80" x2="267" y2="225" stroke="#21262d" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="533" y1="80" x2="533" y2="225" stroke="#21262d" stroke-width="1" stroke-dasharray="6,4"/>
</svg>