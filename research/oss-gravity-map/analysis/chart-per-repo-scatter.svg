<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#0d1117" rx="12"/>
  <text x="450" y="35" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600">Gravity Concentration vs Project Size</text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">29 repositories — top-3 share of gravity, color-coded by language family</text>

  <!-- Legend -->
  <circle cx="180" cy="78" r="5" fill="#42a5f5"/><text x="190" y="82" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Go</text>
  <circle cx="230" cy="78" r="5" fill="#ffd700"/><text x="240" y="82" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Dynamic</text>
  <circle cx="305" cy="78" r="5" fill="#ab47bc"/><text x="315" y="82" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Expressive</text>
  <circle cx="400" cy="78" r="5" fill="#ef5350"/><text x="410" y="82" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Framework</text>
  <circle cx="495" cy="78" r="5" fill="#66bb6a"/><text x="505" y="82" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10">Systems</text>

  <!-- Plot area: x=100..850, y=100 (100%)..460 (0%). x(N)=100+(log10(N)-2)/1.903*750, y(pct)=460-pct/100*360 -->
  <line x1="100" y1="460" x2="850" y2="460" stroke="#30363d" stroke-width="1"/>
  <line x1="100" y1="460" x2="100" y2="100" stroke="#30363d" stroke-width="1"/>

  <!-- X grid + labels: 100,200,500,1K,2K,5K -->
  <line x1="100" y1="460" x2="100" y2="455" stroke="#484f58"/>
  <text x="100" y="478" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">100</text>
  <line x1="219" y1="100" x2="219" y2="460" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="219" y="478" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">200</text>
  <line x1="375" y1="100" x2="375" y2="460" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="375" y="478" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">500</text>
  <line x1="494" y1="100" x2="494" y2="460" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="494" y="478" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">1K</text>
  <line x1="613" y1="100" x2="613" y2="460" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="613" y="478" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">2K</text>
  <line x1="769" y1="100" x2="769" y2="460" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="769" y="478" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">5K</text>

  <!-- Y grid + labels: 0,25,50,75,100% -->
  <text x="90" y="464" text-anchor="end" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">0%</text>
  <line x1="100" y1="370" x2="850" y2="370" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="90" y="374" text-anchor="end" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">25%</text>
  <line x1="100" y1="280" x2="850" y2="280" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="90" y="284" text-anchor="end" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">50%</text>
  <line x1="100" y1="190" x2="850" y2="190" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="90" y="194" text-anchor="end" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">75%</text>
  <line x1="100" y1="100" x2="850" y2="100" stroke="#21262d" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="90" y="104" text-anchor="end" fill="#484f58" font-family="-apple-system,sans-serif" font-size="10">100%</text>

  <text x="450" y="500" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="11">Number of Engineers (log scale)</text>
  <text x="30" y="280" text-anchor="middle" fill="#484f58" font-family="-apple-system,sans-serif" font-size="11" transform="rotate(-90,30,280)">Gravity Concentration — top 3 (%)</text>

  <!-- === Go (blue #42a5f5) === -->
  <!-- esbuild 77.0% -->
  <circle cx="137" cy="183" r="8" fill="#42a5f5" opacity="0.85"/>
  <text x="149" y="179" fill="#42a5f5" font-family="-apple-system,sans-serif" font-size="9" font-weight="600">esbuild 77.0%</text>
  <!-- argo-cd 50.9% -->
  <circle cx="598" cy="277" r="6" fill="#42a5f5" opacity="0.7"/>
  <!-- grafana 45.1% -->
  <circle cx="665" cy="298" r="6" fill="#42a5f5" opacity="0.7"/>
  <!-- kubernetes 27.5% -->
  <circle cx="752" cy="361" r="6" fill="#42a5f5" opacity="0.7"/>
  <text x="764" y="365" fill="#42a5f5" font-family="-apple-system,sans-serif" font-size="9">k8s 27.5%</text>
  <!-- loki 29.8% -->
  <circle cx="535" cy="353" r="6" fill="#42a5f5" opacity="0.7"/>
  <!-- prometheus 64.4% -->
  <circle cx="519" cy="228" r="6" fill="#42a5f5" opacity="0.7"/>
  <!-- terraform 56.2% -->
  <circle cx="623" cy="258" r="6" fill="#42a5f5" opacity="0.7"/>

  <!-- === Dynamic (gold #ffd700) === -->
  <!-- eslint 66.8% -->
  <circle cx="518" cy="220" r="6" fill="#ffd700" opacity="0.7"/>
  <!-- express 60.3% -->
  <circle cx="328" cy="243" r="6" fill="#ffd700" opacity="0.7"/>
  <!-- prettier 95.3% -->
  <circle cx="452" cy="117" r="7" fill="#ffd700" opacity="0.85"/>
  <text x="464" y="113" fill="#ffd700" font-family="-apple-system,sans-serif" font-size="9" font-weight="600">prettier 95.3%</text>
  <!-- react 31.4% -->
  <circle cx="606" cy="347" r="6" fill="#ffd700" opacity="0.7"/>
  <text x="618" y="351" fill="#ffd700" font-family="-apple-system,sans-serif" font-size="9">react 31.4%</text>
  <!-- superset 47.7% -->
  <circle cx="556" cy="288" r="6" fill="#ffd700" opacity="0.7"/>
  <!-- vite 59.9% -->
  <circle cx="526" cy="244" r="6" fill="#ffd700" opacity="0.7"/>

  <!-- === Expressive (purple #ab47bc) === -->
  <!-- polars 78.4% -->
  <circle cx="424" cy="178" r="7" fill="#ab47bc" opacity="0.85"/>
  <text x="436" y="174" fill="#ab47bc" font-family="-apple-system,sans-serif" font-size="9" font-weight="600">polars 78.4%</text>
  <!-- rust 27.6% -->
  <circle cx="832" cy="361" r="6" fill="#ab47bc" opacity="0.7"/>
  <text x="820" y="365" text-anchor="end" fill="#ab47bc" font-family="-apple-system,sans-serif" font-size="9">rust 27.6%</text>
  <!-- scala 37.3% -->
  <circle cx="435" cy="326" r="6" fill="#ab47bc" opacity="0.7"/>
  <!-- scala3 38.9% -->
  <circle cx="475" cy="320" r="6" fill="#ab47bc" opacity="0.7"/>
  <!-- swc 92.0% -->
  <circle cx="314" cy="129" r="7" fill="#ab47bc" opacity="0.85"/>
  <text x="326" y="125" fill="#ab47bc" font-family="-apple-system,sans-serif" font-size="9" font-weight="600">swc 92.0%</text>

  <!-- === Framework (red #ef5350) === -->
  <!-- rails 9.8% -->
  <circle cx="802" cy="425" r="6" fill="#ef5350" opacity="0.7"/>
  <text x="790" y="429" text-anchor="end" fill="#ef5350" font-family="-apple-system,sans-serif" font-size="9">rails 9.8%</text>
  <!-- laravel 38.0% -->
  <circle cx="738" cy="323" r="6" fill="#ef5350" opacity="0.7"/>
  <text x="726" y="327" text-anchor="end" fill="#ef5350" font-family="-apple-system,sans-serif" font-size="9">laravel 38.0%</text>
  <!-- spring-boot 97.2% -->
  <circle cx="555" cy="110" r="7" fill="#ef5350" opacity="0.85"/>
  <text x="567" y="114" fill="#ef5350" font-family="-apple-system,sans-serif" font-size="9" font-weight="600">spring-boot 97.2%</text>
  <!-- nest 68.1% -->
  <circle cx="417" cy="215" r="6" fill="#ef5350" opacity="0.7"/>
  <!-- fastapi 94.5% -->
  <circle cx="468" cy="120" r="7" fill="#ef5350" opacity="0.85"/>
  <text x="480" y="116" fill="#ef5350" font-family="-apple-system,sans-serif" font-size="9" font-weight="600">fastapi 94.5%</text>
  <!-- phoenix 63.5% -->
  <circle cx="545" cy="231" r="6" fill="#ef5350" opacity="0.7"/>

  <!-- === Systems (green #66bb6a) === -->
  <!-- ClickHouse 33.9% -->
  <circle cx="628" cy="338" r="6" fill="#66bb6a" opacity="0.7"/>
  <!-- arrow 14.8% -->
  <circle cx="548" cy="407" r="6" fill="#66bb6a" opacity="0.7"/>
  <!-- duckdb 83.5% -->
  <circle cx="412" cy="159" r="7" fill="#66bb6a" opacity="0.85"/>
  <text x="400" y="155" text-anchor="end" fill="#66bb6a" font-family="-apple-system,sans-serif" font-size="9" font-weight="600">duckdb 83.5%</text>
  <!-- envoy 7.9% -->
  <circle cx="549" cy="432" r="6" fill="#66bb6a" opacity="0.7"/>
  <text x="561" y="436" fill="#66bb6a" font-family="-apple-system,sans-serif" font-size="9">envoy 7.9%</text>
  <!-- redis 9.6% -->
  <circle cx="466" cy="425" r="6" fill="#66bb6a" opacity="0.7"/>

  <!-- Annotation: same language, both extremes -->
  <text x="200" y="240" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">Same language spans</text>
  <text x="200" y="254" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">both extremes —</text>
  <text x="200" y="268" text-anchor="middle" fill="#8b949e" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">governance, not syntax</text>
</svg>